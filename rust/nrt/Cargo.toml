[package]
name = "nrt"
version = "0.1.0"
edition = "2021"

# Standalone native runtime used by `un build`. It implements the unrt_*/un_math_*
# C ABI that Cranelift-emitted object files call, without depending on the VM.
[lib]
name = "nrt"
crate-type = ["staticlib"]

# Spike-only scheduler prototype (W-2026-11-25-P05S). Compiled as a standalone
# test binary; never linked into libnrt.a, so the native-exe path is untouched.
[[test]]
name = "scheduler_spike"
path = "src/scheduler_spike.rs"
