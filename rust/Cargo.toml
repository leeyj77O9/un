[package]
name = "unvm"
version = "0.1.0"
edition = "2021"

[lib]
name = "unvm"
path = "src/lib.rs"
# Also produced as a static library for `un build --embed`, which bundles the
# whole VM runtime (Obj model, natives, collections, exceptions) into one exe.
# Plain `un build` links `nrt` (libnrt.a) instead and contains no VM.
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "un"
path = "src/main.rs"

[workspace]
members = [".", "playground", "nrt"]
# `cargo build --release --manifest-path rust/Cargo.toml` must also produce
# libnrt.a, which `un build` links for no-VM executables.
default-members = [".", "nrt"]

[dependencies]
cranelift-codegen = "0.137.1"
cranelift-frontend = "0.137.1"
cranelift-jit = "0.137.1"
cranelift-module = "0.137.1"
cranelift-native = "0.137.1"
# Object emission for the `un obj` command (Cranelift → relocatable .obj).
cranelift-object = { version = "0.137.1", default-features = false }

[patch.crates-io]
region = { path = "../vendor/region" }
cranelift-jit = { path = "../vendor/cranelift-jit" }
wasmtime-internal-jit-icache-coherence = { path = "../vendor/icache-coherence" }
