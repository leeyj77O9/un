[package]
edition = "2018"
name = "region"
version = "3.0.2"
description = "Cross-platform virtual memory API (raw-FFI fork of region 3.0.2 for x86_64-pc-windows-gnu)"
readme = "README.md"
keywords = ["region", "page", "lock", "protect", "maps"]
license = "MIT"
repository = "https://github.com/darfink/region-rs"

[dependencies.bitflags]
version = "1.0"

[dependencies.libc]
version = "0.2.153"

[target."cfg(any(target_os = \"macos\", target_os = \"ios\"))".dependencies.mach2]
version = "0.4"

[target."cfg(unix)".dev-dependencies.mmap]
version = "0.1.6"
package = "mmap-fixed"
