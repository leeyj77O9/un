# Build + test workflow for the Rust `unvm` implementation.
#
# The GNU toolchain is required: the MSVC linker is not what this project
# targets, and the vendored patches under vendor/ replace the windows-sys
# dependency with raw kernel32 FFI so the GNU toolchain needs no dlltool.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the GNU toolchain
        shell: powershell
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustup target add wasm32-unknown-unknown --toolchain stable-x86_64-pc-windows-gnu

      - name: Build (release)
        shell: powershell
        run: |
          rustup run stable-x86_64-pc-windows-gnu cargo build --release --manifest-path rust/Cargo.toml

      - name: Test (scripts/test.ps1)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test.ps1

      - name: Test (cargo test)
        shell: powershell
        run: |
          rustup run stable-x86_64-pc-windows-gnu cargo test --release --manifest-path rust/Cargo.toml

      - name: Test (Compile Mode)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\compile-check.ps1

      - name: Test (plain-build exe output equality)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\exe-diff.ps1

      - name: Test (edge fuzz)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\edge-fuzz.ps1

      - name: Test (differential JIT on/off)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\differential.ps1

      - name: Test (.unbc round-trip)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\unbc-roundtrip.ps1 -IncludeNegative

      - name: JIT strict canary (UV_JIT=2)
        shell: powershell
        env:
          UV_JIT: "2"
        run: |
          $out = & .\rust\target\release\un.exe run test\jit\strict.un
          $out
          if ($LASTEXITCODE -ne 0) { throw "strict canary exited with $LASTEXITCODE" }
          if ($out -notmatch 'jit-strict canary OK') { throw "strict canary marker not found (a value was computed wrong)" }

      - name: JIT Float strict canary (UV_JIT=2)
        shell: powershell
        env:
          UV_JIT: "2"
        run: |
          $out = & .\rust\target\release\un.exe run test\jit\strict_float.un
          $out
          if ($LASTEXITCODE -ne 0) { throw "float strict canary exited with $LASTEXITCODE" }
          if ($out -notmatch 'jit-float-strict canary OK') { throw "float strict canary marker not found (a value was computed wrong)" }

      - name: JIT strict canary — collections / class / ops (UV_JIT=2)
        shell: powershell
        env:
          UV_JIT: "2"
        run: |
          $fixtures = @(
            @{ Path = 'test\jit\strict_collections.un'; Marker = 'jit-strict-collections canary OK' }
            @{ Path = 'test\jit\strict_class.un';       Marker = 'jit-strict-class canary OK' }
            @{ Path = 'test\jit\strict_ops.un';         Marker = 'jit-strict-ops canary OK' }
          )
          foreach ($f in $fixtures) {
            $out = & .\rust\target\release\un.exe run $f.Path
            $out
            if ($LASTEXITCODE -ne 0) { throw "$($f.Path) strict canary exited with $LASTEXITCODE" }
            if ($out -notmatch [regex]::Escape($f.Marker)) { throw "$($f.Path): marker not found (miscomputation)" }
          }
